name: Daily Contribution Streak Keeper

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          # Configure commit identity
          # Default: GitHub Actions bot user
          # TIP: If you want these commits to count directly toward your personal GitHub
          # profile green contribution graph, replace these with your own GitHub name & email.
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Append timestamp to activity log
        run: |
          echo "Activity timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity-log.txt

      - name: Commit and push changes
        run: |
          git add activity-log.txt
          git commit -m "chore: automated daily graph streak update [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
