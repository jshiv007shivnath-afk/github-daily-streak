name: Daily Contribution Streak Keeper

on:
  schedule:
    # Runs daily at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to create (default: random between 100 and 500)'
        required: false
        default: 'random'

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --local user.name "jshiv007shivnath-afk"
          git config --local user.email "jshiv007.shivnath@gmail.com"

      - name: Generate daily commits (100 to 500 commits)
        run: |
          # Determine commit count: either custom input value or random between 100 and 500
          if [ "${{ github.event.inputs.commit_count }}" != "" ] && [ "${{ github.event.inputs.commit_count }}" != "random" ]; then
            TOTAL_COMMITS=${{ github.event.inputs.commit_count }}
          else
            # Generates random count between 100 and 500
            TOTAL_COMMITS=$(( (RANDOM % 401) + 100 ))
          fi

          echo "Target commit count for today: $TOTAL_COMMITS"

          for i in $(seq 1 $TOTAL_COMMITS); do
            echo "Streak update $i/$TOTAL_COMMITS: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity-log.txt
            git add activity-log.txt
            git commit -m "chore: automated daily graph streak update $i/$TOTAL_COMMITS [skip ci]" --quiet
            sleep 0.1
          done

      - name: Push commits
        run: |
          git pull --rebase origin main || true
          git push origin HEAD:main
